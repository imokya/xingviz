schema_version = "1.0.0"

id = "xingviz"
version = "0.5.0"
name = "XingViz"
tagline = "Direct your previz in plain language with Claude Code"
maintainer = "xingor"
type = "add-on"

website = "https://github.com/imokya/xingviz"

tags = ["Animation", "Camera", "Scene"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Stores the bridge client and screenshots in ~/.xingviz"
network = "Runs Claude Code and a local bridge on 127.0.0.1"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".DS_Store"]
