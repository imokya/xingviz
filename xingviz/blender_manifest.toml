schema_version = "1.0.0"

id = "xingviz"
version = "0.1.0"
name = "XingViz"
tagline = "Direct your previz in plain language with Claude Code"
maintainer = "xingor"
type = "add-on"

website = "https://github.com/imokya/xingviz"

tags = ["Animation", "Camera", "Scene"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read, write and version the previz script next to it"
network = "Launches the Claude Code CLI, which talks to the Anthropic API"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", ".DS_Store"]
